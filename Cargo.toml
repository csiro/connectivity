[package]
name = "rust_conn"
version = "1.1.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rust_conn"
crate-type = ["cdylib"]

[dependencies]
pyo3 = {version = "0.22", default-features = false, features = ["macros", "gil-refs", "py-clone"]}
pyo3-built = "0.5"
numpy = {version = "0.22", features = ["gil-refs"]}
ndarray = "0.16"
pathfinding = "4.14.0"
ordered-float = "4.2.0"
rayon = "1.11"
num_cpus = "1.16"
anyhow = "1.0.100"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3 
