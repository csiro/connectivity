[package]
name = "rust_conn"
version = "2.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rust_conn"
crate-type = ["cdylib"]

[dependencies]
pyo3 = {version = "0.28", default-features = false, features = ["macros", "abi3-py38"]}
pyo3-built = "0.5"
numpy = "0.28"
ndarray = { version = "0.16", features = ["rayon"] }
pathfinding = "4.14.0"
ordered-float = "4.2.0"
rayon = "1.11"
num_cpus = "1.16"
anyhow = "1.0.100"
rustc-hash = "2.1"

[build-dependencies]
pyo3-build-config = { version = "0.28", features = ["resolve-config"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3 
