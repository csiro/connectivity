[workspace]
# The R binding in r/connectivity is its own workspace and uses the published core
members = ["crates/connectivity-core", "python"]
# Virtual workspaces default to resolver 1; keep the one edition 2021 packages use
resolver = "2"

# Versions shared by the extension and the core
[workspace.dependencies]
anyhow = "1.0.100"
ndarray = { version = "0.17", features = ["rayon"] }
num_cpus = "1.16"
rayon = "1.11"

[profile.release]
# Stripped builds fail to load on recent macOS (dyld: "mis-aligned LINKEDIT string pool")
strip = false
lto = true
codegen-units = 1
opt-level = 3
