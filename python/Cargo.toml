[package]
name = "rust_conn"
# PEP 440 2.5.0.dev0 until the 2.5.0 release
version = "2.5.0-dev0"
edition = "2021"
license = "MIT"
# Released as the eco-connectivity Python wheels; only connectivity-core goes to crates.io
publish = false
# Rust sources only; pyproject.toml adds the Python package and data to the sdist once
include = ["/build.rs", "/src/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rust_conn"
crate-type = ["cdylib"]

[dependencies]
connectivity-core = { path = "../crates/connectivity-core", version = "0.2.0" }
pyo3 = {version = "0.30", default-features = false, features = ["macros", "abi3-py310"]}
pyo3-built = "0.5"
numpy = "0.30"
ndarray = { workspace = true }
ordered-float = "4.2.0"
rayon = { workspace = true }
num_cpus = { workspace = true }
anyhow = { workspace = true }

[build-dependencies]
pyo3-build-config = { version = "0.30", features = ["resolve-config"] }
