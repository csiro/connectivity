name: Build and publish

on:
  push:
    branches:
      - main
    tags:
      # Python releases (eco-connectivity); connectivity-core uses connectivity-core-v* tags
      - "v[0-9]*"
    # Only Python and core changes build wheels. GitHub does not evaluate path filters
    # for tag pushes, so release tags always run.
    paths:
      - "python/**"
      - "crates/connectivity-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/publish.yml"
  pull_request:
    paths:
      - "python/**"
      - "crates/connectivity-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64, Linux aarch64, macOS universal2 and Windows x64.
        # Build and test settings are in [tool.cibuildwheel] in python/pyproject.toml.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Drop local CPU tuning
        # .cargo/config.toml sets target-cpu=native for local builds, but
        # published wheels must run on any CPU
        shell: bash
        run: rm -f .cargo/config.toml
      # Linux builds copy the whole checkout into the container, so the
      # workspace root and the core crate stay reachable from python/
      - uses: pypa/cibuildwheel@v4.3.0
        with:
          package-dir: python
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Drop local CPU tuning
        run: rm -f .cargo/config.toml
      - name: Build sdist
        run: pipx run build --sdist python --outdir dist
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Drop local CPU tuning
        run: rm -f .cargo/config.toml
      # PyO3 links libpython for test binaries
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run workspace tests
        run: cargo test --workspace --locked

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist, tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Must match the trusted publisher configured on PyPI
    environment:
      name: pypi
      url: https://pypi.org/p/eco-connectivity
    permissions:
      # Used for PyPI trusted publishing and to sign the build provenance
      id-token: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Check the tag matches the package version
        # Only a vX.Y.Z tag naming the eco-connectivity version may publish
        env:
          TAG: ${{ github.ref_name }}
        run: ls "dist/eco_connectivity-${TAG#v}.tar.gz" dist/eco_connectivity-"${TAG#v}"-*.whl
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach files to GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Upload wheels and sdist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "$TAG" --generate-notes
          fi
