name: R package

on:
  push:
    branches: [main]
    paths:
      - "r/**"
      - "crates/connectivity-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/r-cmd-check.yml"
  pull_request:
    paths:
      - "r/**"
      - "crates/connectivity-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/r-cmd-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: R CMD check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/ecoconnectivity
          extra-packages: |
            any::rextendr
            any::rcmdcheck
      - name: Prepare standalone core and vendored Rust dependencies
        shell: Rscript {0}
        run: |
          source("r/ecoconnectivity/tools/prepare-source.R")
          prepare_source("r/ecoconnectivity")
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r/ecoconnectivity
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
