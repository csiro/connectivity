name: R package

on:
  push:
    branches: [main]
    paths:
      - "r/**"
      - ".github/workflows/r-cmd-check.yml"
  pull_request:
    paths:
      - "r/**"
      - ".github/workflows/r-cmd-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: R CMD check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # Runners ship with rustup; this repository does not allow third-party
      # setup actions such as dtolnay/rust-toolchain.
      - name: Add the Rust target used by R on Windows
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/connectivity
          extra-packages: |
            any::rextendr
            any::rcmdcheck
      - name: Vendor published Rust dependencies
        shell: Rscript {0}
        run: |
          source("r/connectivity/tools/prepare-source.R")
          prepare_source("r/connectivity")
      # --as-cran warns without checkbashisms; setup-r installs it on macOS.
      - name: Install checkbashisms
        if: runner.os == 'Linux'
        run: command -v checkbashisms || sudo apt-get install -y --no-install-recommends devscripts
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r/connectivity
          # Windows has no checkbashisms; Linux and macOS run the CRAN checks.
          args: ${{ runner.os == 'Windows' && 'c("--no-manual")' || 'c("--no-manual", "--as-cran")' }}
          error-on: '"warning"'
