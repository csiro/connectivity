[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "eco-connectivity"
description = "A multi-resolution landscape connectivity algorithm written in Rust"
authors = [{ name = "Roozbeh Valavi", email = "roozbeh.valavi@csiro.au" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "rasterio>=1.2",
    "geopandas",
    "shapely",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
[tool.maturin]
include = [
    # All .py files in the package directory, including subpackages
    { path = "connectivity/**/*.py", format = ["sdist", "wheel"] },
    # Example rasters used by the notebooks in examples/
    { path = "connectivity/data/*.tif", format = ["sdist", "wheel"] },
    { path = "connectivity/data/transgrids/*.tif", format = ["sdist", "wheel"] },
    { path = "connectivity/data/README.md", format = ["sdist", "wheel"] },
    # Notebooks ship in the source distribution only, not in the wheels
    { path = "examples/*.ipynb", format = ["sdist"] },
]

[tool.cibuildwheel]
# The abi3 wheel built for the first Python is reused, and tested, on later versions
archs = ["native"]
skip = ["*-musllinux_*"]  # rasterio has no musllinux wheels
test-command = '''python -c "import numpy as np; from connectivity import connectedness, example_data_path; r = connectedness(condition_file=example_data_path('site_condition')); assert r.shape == (516, 588) and 0 < np.nanmax(r) <= 1"'''
test-skip = ["cp315-*"]  # shapely has no Python 3.15 wheels yet

[tool.cibuildwheel.linux]
# The manylinux build containers don't include Rust
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
archs = ["universal2"]  # one wheel for Intel and Apple Silicon
before-all = "rustup target add aarch64-apple-darwin x86_64-apple-darwin"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.12" }  # Rust's minimum macOS version

[project.urls]
Homepage = "https://github.com/csiro/connectivity"
Repository = "https://github.com/csiro/connectivity"
Issues = "https://github.com/csiro/connectivity/issues" 
