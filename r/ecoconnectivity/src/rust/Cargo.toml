[package]
name = 'ecoconnectivity'
publish = false
version = '0.0.0'
edition = '2021'
rust-version = '1.86'

# The R binding has its own dependency lock and release cycle. Do not add it to
# the Python/core workspace: R installation must also work from a source archive.
[workspace]

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'ecoconnectivity'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
connectivity-core = { path = 'connectivity-core', version = '=0.1.0' }
extendr-api = { version = '=0.9.0', default-features = false, features = ['result_list'] }
rayon = '1.11'

[profile.release]
lto = true
codegen-units = 1
